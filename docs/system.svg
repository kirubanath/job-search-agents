<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="626" viewBox="0 36 1060 626" role="img" aria-label="Five agent jobs read their instructions from Google Docs, keep state in a Google Sheet, read job sites through helpers, and hand drafts to a person who submits and sends everything himself.">
  <style>
text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.d-a{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10px;fill:#566170;text-anchor:middle}
.d-bx{fill:#ffffff;stroke:#0f1720;stroke-width:1.2}
.d-cg{fill:#c2410c}
.d-cn{fill:#0f1720}
.d-ct{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;font-weight:500;fill:#fff;text-anchor:middle}
.d-gate{stroke:#c2410c;stroke-width:2.2;fill:none}
.d-grp{fill:none;stroke:#566170;stroke-width:1;stroke-dasharray:4 4}
.d-gs{font-size:12px;fill:#c2410c}
.d-gt{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:500;letter-spacing:.09em;fill:#c2410c}
.d-g{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:.09em;fill:#566170}
.d-hg{fill:#c2410c}
.d-h{fill:#0f1720}
.d-job{fill:#e9eefb;stroke:#1b47b8;stroke-width:1.2}
.d-ln{stroke:#0f1720;stroke-width:1.3;fill:none}
.d-s{font-size:11.5px;fill:#566170}
.d-t{font-size:13.5px;font-weight:600;fill:#0f1720}
</style>
  <rect x="0" y="36" width="1060" height="626" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-h" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="d-hg" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <rect class="d-bx" x="30" y="205" width="150" height="80" rx="3"/>
  <text class="d-t" x="46" y="240">Me</text>
  <text class="d-s" x="46" y="259">start a job, decide</text>
  <rect class="d-bx" x="30" y="455" width="150" height="80" rx="3"/>
  <text class="d-t" x="46" y="490">Employers</text>
  <text class="d-s" x="46" y="509">forms and recruiters</text>

  <line class="d-gate" x1="105" y1="285" x2="105" y2="453" marker-end="url(#ahg)"/>
  <line class="d-gate" x1="93" y1="412" x2="117" y2="412"/><line class="d-gate" x1="93" y1="419" x2="117" y2="419"/>
  <circle class="d-cg" cx="105" cy="318" r="9.5"/><text class="d-ct" x="105" y="322">2</text>
  <text class="d-gt" x="122" y="352">HUMAN GATE</text>
  <text class="d-gs" x="122" y="370">I submit and send</text>
  <text class="d-gs" x="122" y="386">everything myself</text>

  <rect class="d-grp" x="260" y="50" width="240" height="440" rx="3"/>
  <text class="d-g" x="275" y="74">FIVE JOBS</text>
  <text class="d-s" x="275" y="92">each a cold chat on a small model</text>
  <g class="job" data-job="1" tabindex="0" role="button" aria-label="Job 1, Search"><rect class="d-job" x="275" y="105" width="210" height="56" rx="3"/><text class="d-t" x="290" y="129">1  Search</text><text class="d-s" x="290" y="147">screen, rank, find referrals</text></g>
  <g class="job" data-job="2" tabindex="0" role="button" aria-label="Job 2, Apply"><rect class="d-job" x="275" y="180" width="210" height="56" rx="3"/><text class="d-t" x="290" y="204">2  Apply</text><text class="d-s" x="290" y="222">one application pack at a time</text></g>
  <g class="job" data-job="3" tabindex="0" role="button" aria-label="Job 3, Reply"><rect class="d-job" x="275" y="255" width="210" height="56" rx="3"/><text class="d-t" x="290" y="279">3  Reply</text><text class="d-s" x="290" y="297">judge a message, draft a reply</text></g>
  <g class="job" data-job="4" tabindex="0" role="button" aria-label="Job 4, Call Prep"><rect class="d-job" x="275" y="330" width="210" height="56" rx="3"/><text class="d-t" x="290" y="354">4  Call Prep</text><text class="d-s" x="290" y="372">one-page sheet for a call</text></g>
  <g class="job" data-job="5" tabindex="0" role="button" aria-label="Job 5, Weekly Review"><rect class="d-job" x="275" y="405" width="210" height="56" rx="3"/><text class="d-t" x="290" y="429">5  Weekly Review</text><text class="d-s" x="290" y="447">clean up, follow-ups, counts</text></g>

  <line class="d-ln" x1="180" y1="232" x2="258" y2="232" marker-end="url(#ah)"/>
  <text class="d-a" x="220" y="224">paste line</text>
  <line class="d-ln" x1="260" y1="262" x2="182" y2="262" marker-end="url(#ah)"/>
  <text class="d-a" x="220" y="280">drafts</text>

  <rect class="d-grp" x="580" y="50" width="460" height="190" rx="3"/>
  <text class="d-g" x="595" y="74">MEMORY · GOOGLE DOCS</text>
  <text class="d-s" x="595" y="92">each job reads its documents in full at the start</text>
  <circle class="d-cn" cx="1040" cy="50" r="9.5"/><text class="d-ct" x="1040" y="54">1</text>
  <g data-j="1 2 3 4 5"><rect class="d-bx" x="592" y="105" width="138" height="118" rx="3"/>
  <text class="d-t" x="604" y="130">Procedure</text>
  <text class="d-s" x="604" y="152">steps and checks,</text><text class="d-s" x="604" y="168">safety limits, in</text><text class="d-s" x="604" y="184">controlled English</text></g>
  <g data-j="2 3 4"><rect class="d-bx" x="741" y="105" width="138" height="118" rx="3"/>
  <text class="d-t" x="753" y="130">Facts about me</text>
  <text class="d-s" x="753" y="152">criteria and dates,</text><text class="d-s" x="753" y="168">what I never claim,</text><text class="d-s" x="753" y="184">kept as context</text></g>
  <g data-j="2 3 4"><rect class="d-bx" x="890" y="105" width="138" height="118" rx="3"/>
  <text class="d-t" x="902" y="130">My voice</text>
  <text class="d-s" x="902" y="152">my own stories and</text><text class="d-s" x="902" y="168">messages I sent,</text><text class="d-s" x="902" y="184">copied, not invented</text></g>
  <line class="d-ln" x1="580" y1="150" x2="502" y2="150" marker-end="url(#ah)"/>
  <text class="d-a" x="541" y="142">reads</text>

  <rect class="d-bx" x="580" y="270" width="460" height="90" rx="3"/>
  <text class="d-g" x="595" y="294">STATE · GOOGLE SHEET</text>
  <text class="d-t" x="595" y="316">The tracker</text>
  <text class="d-s" x="595" y="336">postings and ranks, referral contacts, interviews, weekly counts</text>
  <line class="d-ln" x1="502" y1="315" x2="578" y2="315" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="d-a" x="540" y="307">read, write</text>

  <g data-j="1"><rect class="d-bx" x="580" y="395" width="200" height="95" rx="3"/>
  <text class="d-g" x="595" y="419">HELPERS</text>
  <text class="d-t" x="595" y="441">One subagent per site</text>
  <text class="d-s" x="595" y="461">each gets one site sheet</text>
  <line class="d-ln" x1="500" y1="442" x2="578" y2="442" marker-end="url(#ah)"/>
  <text class="d-a" x="539" y="434">starts</text>
  <rect class="d-bx" x="860" y="395" width="180" height="95" rx="3"/>
  <text class="d-g" x="875" y="419">JOB SITES</text>
  <text class="d-t" x="875" y="441">LinkedIn, Naukri,</text>
  <text class="d-t" x="875" y="459">careers pages</text>
  <line class="d-ln" x1="780" y1="442" x2="858" y2="442" marker-end="url(#ah)"/>
  <text class="d-a" x="820" y="434">read only</text></g>

  <rect class="d-grp" x="260" y="520" width="780" height="128" rx="3"/>
  <text class="d-g" x="275" y="544">REFINEMENT LOOP</text>
  <circle class="d-cn" cx="1040" cy="520" r="9.5"/><text class="d-ct" x="1040" y="524">3</text>
  <rect class="d-bx" x="275" y="557" width="220" height="46" rx="3"/>
  <text class="d-s" x="288" y="577">A strong model writes</text><text class="d-s" x="288" y="593">the job documents</text>
  <rect class="d-bx" x="540" y="557" width="220" height="46" rx="3"/>
  <text class="d-s" x="553" y="577">A separate agent audits them</text><text class="d-s" x="553" y="593">against the originals</text>
  <rect class="d-bx" x="805" y="557" width="220" height="46" rx="3"/>
  <text class="d-s" x="818" y="577">Each job is tested from a cold</text><text class="d-s" x="818" y="593">start on the small model</text>
  <line class="d-ln" x1="495" y1="580" x2="538" y2="580" marker-end="url(#ah)"/>
  <line class="d-ln" x1="760" y1="580" x2="803" y2="580" marker-end="url(#ah)"/>
  <path class="d-ln" d="M915 603V622H385V605" marker-end="url(#ah)"/>
  <text class="d-a" x="650" y="638">fix what the audit and the tests find, then repeat</text>
</svg>
